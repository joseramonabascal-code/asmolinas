<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arma tu pedido | AS MOLINAS</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://asmolinas.com/#catalogo">
  <meta http-equiv="refresh" content="0; url=/#catalogo">
  <script>
    (function () {
      var p = new URLSearchParams(location.search).get('producto');
      location.replace('/' + (p ? '?agregar=' + encodeURIComponent(p) : '') + '#catalogo');
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
  <p>Ahora los pedidos se arman en el catálogo de la página de inicio. <a href="/#catalogo">Ir al catálogo</a>.</p>
</body>
</html>
